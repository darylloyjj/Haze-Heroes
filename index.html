<title>Haze Heroes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
/* Layout: one dark arcade cabinet column, the 320x180 game scaled up in whole pixels, a slim control legend underneath */
:root {
  --bg: #14100d;
  --panel: #24211c;
  --ink: #efe6d6;
  --muted: #bfb4a2;
  --accent: #f2c14e;
  --ember: #e8853a;
  --line: #4a443a;
  --font-display: 'Press Start 2P', ui-monospace, monospace;
  --font-body: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 13px;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box; overflow-x: hidden;
}
#wrap { position: relative; width: 100%; display: flex; justify-content: center; }
canvas {
  display: block; image-rendering: pixelated; image-rendering: crisp-edges;
  background: #000; border: 2px solid var(--line); border-radius: 4px; outline: none;
  max-width: 100%;
}
canvas:focus-visible { border-color: var(--accent); }
#focus {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
#focus[hidden] { display: none; }
#focus span {
  font-family: var(--font-display); font-size: 11px; color: var(--accent);
  background: rgba(20, 16, 13, 0.85); padding: 10px 14px; border: 1px solid var(--ember);
}
.legend {
  display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center;
  color: var(--muted); max-width: 980px; line-height: 1.6;
}
.legend b { color: var(--ink); font-weight: 600; letter-spacing: 0.04em; }
/* ---- touch controls: only on phones / tablets ---- */
#pad { display: none; }
body.touch { padding: 0; gap: 0; height: 100dvh; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
body.touch .legend { display: none; }
/* full screen on a computer: the game fills the screen, nothing else shows */
body.fs { padding: 0; gap: 0; height: 100vh; justify-content: center; background: #000; overflow: hidden; }
body.fs .legend { display: none; }
body.fs canvas { border: 0; border-radius: 0; }
.fsbtn { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 2px 10px; cursor: pointer; }
.fsbtn:hover { border-color: var(--accent); }
body.touch canvas { border: 0; border-radius: 0; touch-action: none; }
body.touch #pad { display: flex; touch-action: none; }
.stick { position: relative; width: 150px; height: 150px; border-radius: 50%; background: rgba(36, 33, 28, 0.45);
  border: 3px solid rgba(242, 193, 78, 0.5); flex: none; touch-action: none; }
.knob { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
  background: rgba(242, 193, 78, 0.9); border: 2px solid #0b0a0a; box-shadow: 0 3px 0 #0b0a0a; transition: transform 60ms; }
/* button cluster: attack biggest at the thumb's resting spot, the others fanned around it with clear gaps */
.btns { position: relative; width: 236px; height: 222px; flex: none; }
.btn { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-align: center;
  font-family: var(--font-display); color: #24211c; border: 3px solid #0b0a0a; box-shadow: 0 4px 0 #0b0a0a;
  touch-action: none; line-height: 1.3; }
.btn.on { transform: translateY(3px); box-shadow: 0 1px 0 #0b0a0a; filter: brightness(1.25); }
.b-atk { width: 100px; height: 100px; right: 8px;   bottom: 18px;  background: #f2c14e; font-size: 11px; }
.b-sp  { width: 78px;  height: 78px;  right: 18px;  bottom: 140px; background: #5fd3f5; font-size: 9px; }
.b-dash{ width: 78px;  height: 78px;  right: 132px; bottom: 0px;   background: #e7849a; font-size: 8px; }
.b-act { width: 64px;  height: 64px;  right: 140px; bottom: 112px; background: #9cc24a; font-size: 14px; }
.minis { display: flex; gap: 10px; }
.mini { font-family: var(--font-display); font-size: 9px; color: var(--ink); background: rgba(36,33,28,0.8);
  border: 1px solid var(--line); border-radius: 4px; padding: 9px 11px; touch-action: none; }
.mini.on { border-color: var(--accent); color: var(--accent); }
/* portrait: game on top, controls in the space underneath, inset from the edges */
body.touch.portrait { justify-content: flex-start; }
body.touch.portrait #pad { flex: 1; width: 100%; box-sizing: border-box; flex-direction: column; justify-content: space-between;
  padding: 14px 6vw max(36px, env(safe-area-inset-bottom)); gap: 10px; }
body.touch.portrait .row { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; }
body.touch.portrait .minis { justify-content: center; }
body.touch.portrait .stick { width: var(--stick, 160px); height: var(--stick, 160px); margin-bottom: 24px; }
body.touch.portrait .btns { width: calc(236px * var(--btns, 1)); height: calc(222px * var(--btns, 1)); }
body.touch.portrait .btns > .btn { transform-origin: center; }
body.touch.portrait .btns .b-atk, body.touch.portrait .btns .b-sp, body.touch.portrait .btns .b-dash, body.touch.portrait .btns .b-act { zoom: var(--btns, 1); }
body.touch.portrait .knob { width: 68px; height: 68px; margin: -34px 0 0 -34px; }
/* landscape: the game fills the screen; controls float over it, pulled in from the corners */
body.touch.landscape { justify-content: center; }
body.touch.landscape #pad { position: fixed; inset: 0; pointer-events: none; }
body.touch.landscape #pad .row { position: absolute; left: max(6vw, 36px, env(safe-area-inset-left)); right: max(4vw, 26px, env(safe-area-inset-right));
  bottom: max(9vh, 22px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: flex-end; }
body.touch.landscape .stick, body.touch.landscape .btn, body.touch.landscape .mini { pointer-events: auto; }
body.touch.landscape .stick { width: 144px; height: 144px; margin-bottom: 8px; background: rgba(36, 33, 28, 0.28); border-color: rgba(242, 193, 78, 0.4); }
body.touch.landscape .knob { opacity: 0.8; }
body.touch.landscape .btn { opacity: 0.66; }
body.touch.landscape .btn.on { opacity: 0.92; }
body.touch.landscape .minis { position: absolute; bottom: max(6px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); }
body.touch.landscape .mini { opacity: 0.75; padding: 6px 8px; font-size: 8px; }
body.touch[data-mode="hidden"] #pad .row { visibility: hidden; }
body.touch[data-mode="menu"] .b-atk, body.touch[data-mode="menu"] .b-sp, body.touch[data-mode="menu"] .b-dash { visibility: hidden; }
/* short landscape phones: shrink the cluster a touch so it still fits under the HUD */
@media (orientation: landscape) and (max-height: 380px) {
  body.touch.landscape .btns { transform: scale(0.88); transform-origin: right bottom; }
  body.touch.landscape .stick { width: 128px; height: 128px; }
}
kbd {
  font-family: var(--font-body); font-size: 11px; color: var(--ink);
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px;
  background: var(--panel);
}
</style>

<div id="pad" aria-label="Touch controls">

    <div class="stick" id="stick"><div class="knob" id="knob"></div></div>

</div>

</div>

const IMG = {}; const FLASH = {};

    FLASH[k] = whiteOf(im);
    if (k.startsWith('hero') && !k.includes('_nm')) { const n = k + '_n95'; IMG[n] = recolor(im, N95MAP); FLASH[n] = whiteOf(IMG[n]); }

}

  const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
  const x = c.getContext('2d'); x.drawImage(im, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height);
  for (let i = 0; i < d.data.length; i += 4) {
    const k = ((d.data[i] << 16) | (d.data[i + 1] << 8) | d.data[i + 2]).toString(16).padStart(6, '0');
    if (map[k]) { const v = parseInt(map[k], 16); d.data[i] = v >> 16; d.data[i + 1] = (v >> 8) & 255; d.data[i + 2] = v & 255; }

  x.putImageData(d, 0, 0); return c;
}

    const t = ac.currentTime + (o.at || 0), dur = o.dur;
    const src = ac.createGain(); const oscs = [];
    for (const [mul, v] of (o.layers || [[1, 1]])) {
      const os = ac.createOscillator(); os.type = o.src || 'sawtooth'; path(os.frequency, t, o.f.map(x => Math.max(20, x * mul)), dur, true);
      if (o.vib) lfo(os.detune, t, dur, o.vib[0], o.vib[1]);
      const g = ac.createGain(); g.gain.value = v; os.connect(g); g.connect(src); oscs.push(os);
    }
    let feed = src;
    if (o.grit) { const ws = ac.createWaveShaper(), c = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 511.5 - 1; c[i] = Math.tanh(x * o.grit); } ws.curve = c; src.connect(ws); feed = ws; }
    const amp = ac.createGain(); amp.gain.setValueAtTime(0.0001, t);
    const fs = [0.9, 0.55, 0.3].map(w => { const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = o.q || 7; const g = ac.createGain(); g.gain.value = w; feed.connect(bp); bp.connect(g); g.connect(amp); return bp; });

      [F1, F2, F3].forEach((F, i) => st === 0 ? fs[i].frequency.setValueAtTime(F, tt) : fs[i].frequency.linearRampToValueAtTime(F, tt));
      st === 0 ? amp.gain.setValueAtTime(v, tt) : amp.gain.linearRampToValueAtTime(v, tt);
    }
    out(amp, o); for (const os of oscs) { os.start(t); os.stop(t + dur + 0.05); }
  }

  function curve(k) { if (!curves[k]) { const c = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 511.5 - 1; c[i] = Math.tanh(x * k) / Math.tanh(k); } curves[k] = c; } return curves[k]; }

  if (!isPixelText(s)) {
    // the 3x5 pixel font is A-Z only: draw other scripts (快点, சீக்கிரம்) with the system font at a matching size
    ctx.save(); ctx.font = `bold ${8 * scale}px "Noto Sans", "Nirmala UI", "Tamil Sangam MN", "Noto Sans Tamil", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif`; ctx.textBaseline = 'top';
    if (shadow) { ctx.fillStyle = shadow; ctx.fillText(s, x + 1, y - 1); }
    ctx.fillStyle = col; ctx.fillText(s, x, y - 2); ctx.restore(); return;
  }
  s = String(s).toUpperCase();
  const pass = (dx, dy, c) => {
    ctx.fillStyle = c; let cx = x;
    for (const ch of s) {
      const g = FONT[ch] || FONT[' '];
      for (let i = 0; i < 15; i++) if (g[i] === '1') ctx.fillRect(cx + (i % 3) * scale + dx, y + ((i / 3) | 0) * scale + dy, scale, scale);
      cx += 4 * scale;
    }
  };
  if (shadow) pass(1, 1, shadow);
  pass(0, 0, col);
}

/* ---------------- room flow ---------------- */
function updateRun(dt) {
  G.timeInRoom += dt;
  if (!G.boon && !G.cut) qTick(dt);
  if (G.boon) return updateBoon();
  if (P.hurtFlash > 0) P.hurtFlash -= dt;
  if (G.cut) { updateCut(dt); P.ghosts = []; P.moving = false; return; }
  if (G.revive) { updateRevive(dt); return; }
  if (P.inv > 0) P.inv -= dt;
  movePlayer(dt, true);
  if (G.tut) tutTick(dt);
  updateAttacks(dt);
  if (G.spawnT > 0) { G.spawnT -= dt; if (G.spawnT <= 0) spawnWave(); }
  updateEnemies(dt);
  // first run only: Jun Jie's first look at the Hazed, once the first wave has finished forming
  if (save.runCount === 1 && G.room === 1 && !G.sawHazed && G.wave >= 1 && G.enemies.length && G.enemies.every(e => e.spawn <= 0)) {
    G.sawHazed = true; const img = P.masked ? 'hero' : 'hero_nm';
    say(img, 'JUN JIE', 'WOAH, SO THIS IS WHAT THEY LOOK LIKE...', () => say(img, 'JUN JIE', "IMMA BEAT YOU GUYS UP!"));
  }
  // first run only: Jun Jie's first look at a brute
  if (save.runCount === 1 && !G.sawBrute && !G.dialog && G.enemies.some(e => e.type === 'brute' && e.state === 'alive' && e.spawn <= 0)) {
    G.sawBrute = true; say(P.masked ? 'hero' : 'hero_nm', 'JUN JIE', "WOW, THAT'S ONE BIG BOY...");
  }
  if (G.boss) updateBoss(dt);
  updateShots(dt);
  // pickups
  for (const p of G.pickups) {
    p.t += dt;
    const d = Math.hypot(p.x - P.x, p.y - P.y);
    if (p.vx) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.pow(0.02, dt); p.vy *= Math.pow(0.02, dt); if (Math.abs(p.vx) < 2) p.vx = 0; }
    if ((p.k === 'air' || p.k === 'coin') && p.t > 0.35) {
      if (G.cleared && G.room <= FIGHT_ROOMS) { const v = Math.max(200, d * 5) * dt, l = d || 1; p.x += (P.x - p.x) / l * Math.min(v, l); p.y += (P.y - p.y) / l * Math.min(v, l); p.vx = 0; p.vy = 0; }   // room done: everything flies to you

function qDraw(d) {
