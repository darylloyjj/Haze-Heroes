<title>Haze Heroes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
/* Layout: one dark arcade cabinet column, the 320x180 game scaled up in whole pixels, a slim control legend underneath */
:root {
  --bg: #14100d;
  --panel: #24211c;
  --ink: #efe6d6;
  --muted: #bfb4a2;
  --accent: #f2c14e;
  --ember: #e8853a;
  --line: #4a443a;
  --font-display: 'Press Start 2P', ui-monospace, monospace;
  --font-body: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 13px;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box; overflow-x: hidden;
}
#wrap { position: relative; width: 100%; display: flex; justify-content: center; }
canvas {
  display: block; image-rendering: pixelated; image-rendering: crisp-edges;
  background: #000; border: 2px solid var(--line); border-radius: 4px; outline: none;
  max-width: 100%;
}
canvas:focus-visible { border-color: var(--accent); }
#focus {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
#focus[hidden] { display: none; }
#focus span {
  font-family: var(--font-display); font-size: 11px; color: var(--accent);
  background: rgba(20, 16, 13, 0.85); padding: 10px 14px; border: 1px solid var(--ember);
}
.legend {
  display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center;
  color: var(--muted); max-width: 980px; line-height: 1.6;
}
.legend b { color: var(--ink); font-weight: 600; letter-spacing: 0.04em; }
/* ---- touch controls: only on phones / tablets ---- */
#pad { display: none; }
body.touch { padding: 0; gap: 0; height: 100dvh; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
body.touch .legend { display: none; }
/* full screen on a computer: the game fills the screen, nothing else shows */
body.fs { padding: 0; gap: 0; height: 100vh; justify-content: center; background: #000; overflow: hidden; }
body.fs .legend { display: none; }
body.fs canvas { border: 0; border-radius: 0; }
.fsbtn { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 2px 10px; cursor: pointer; }
.fsbtn:hover { border-color: var(--accent); }
body.touch canvas { border: 0; border-radius: 0; touch-action: none; }
body.touch #pad { display: flex; touch-action: none; }
.stick { position: relative; width: 150px; height: 150px; border-radius: 50%; background: rgba(36, 33, 28, 0.45);
  border: 3px solid rgba(242, 193, 78, 0.5); flex: none; touch-action: none; }
.knob { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
  background: rgba(242, 193, 78, 0.9); border: 2px solid #0b0a0a; box-shadow: 0 3px 0 #0b0a0a; transition: transform 60ms; }
/* button cluster: attack biggest at the thumb's resting spot, the others fanned around it with clear gaps */
.btns { position: relative; width: 236px; height: 222px; flex: none; }
.btn { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-align: center;
  font-family: var(--font-display); color: #24211c; border: 3px solid #0b0a0a; box-shadow: 0 4px 0 #0b0a0a;
  touch-action: none; line-height: 1.3; }
.btn.on { transform: translateY(3px); box-shadow: 0 1px 0 #0b0a0a; filter: brightness(1.25); }
.b-atk { width: 100px; height: 100px; right: 8px;   bottom: 18px;  background: #f2c14e; font-size: 11px; }
.b-sp  { width: 78px;  height: 78px;  right: 18px;  bottom: 140px; background: #5fd3f5; font-size: 9px; }
.b-dash{ width: 78px;  height: 78px;  right: 132px; bottom: 0px;   background: #e7849a; font-size: 8px; }
.b-act { width: 64px;  height: 64px;  right: 140px; bottom: 112px; background: #9cc24a; font-size: 14px; }
.minis { display: flex; gap: 10px; }
.mini { font-family: var(--font-display); font-size: 9px; color: var(--ink); background: rgba(36,33,28,0.8);
  border: 1px solid var(--line); border-radius: 4px; padding: 9px 11px; touch-action: none; }
.mini.on { border-color: var(--accent); color: var(--accent); }
/* portrait: game on top, controls in the space underneath, inset from the edges */
body.touch.portrait { justify-content: flex-start; }
body.touch.portrait #pad { flex: 1; width: 100%; box-sizing: border-box; flex-direction: column; justify-content: space-between;
  padding: 14px 6vw max(36px, env(safe-area-inset-bottom)); gap: 10px; }
body.touch.portrait .row { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; }
body.touch.portrait .minis { justify-content: center; }
body.touch.portrait .stick { width: var(--stick, 160px); height: var(--stick, 160px); margin-bottom: 24px; }
body.touch.portrait .btns { width: calc(236px * var(--btns, 1)); height: calc(222px * var(--btns, 1)); }
body.touch.portrait .btns > .btn { transform-origin: center; }
body.touch.portrait .btns .b-atk, body.touch.portrait .btns .b-sp, body.touch.portrait .btns .b-dash, body.touch.portrait .btns .b-act { zoom: var(--btns, 1); }
body.touch.portrait .knob { width: 68px; height: 68px; margin: -34px 0 0 -34px; }
/* landscape: the game fills the screen; controls float over it, pulled in from the corners */
body.touch.landscape { justify-content: center; }
body.touch.landscape #pad { position: fixed; inset: 0; pointer-events: none; }
body.touch.landscape #pad .row { position: absolute; left: max(6vw, 36px, env(safe-area-inset-left)); right: max(4vw, 26px, env(safe-area-inset-right));
  bottom: max(9vh, 22px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: flex-end; }
body.touch.landscape .stick, body.touch.landscape .btn, body.touch.landscape .mini { pointer-events: auto; }
body.touch.landscape .stick { width: 144px; height: 144px; margin-bottom: 8px; background: rgba(36, 33, 28, 0.28); border-color: rgba(242, 193, 78, 0.4); }
body.touch.landscape .knob { opacity: 0.8; }
body.touch.landscape .btn { opacity: 0.66; }
body.touch.landscape .btn.on { opacity: 0.92; }
body.touch.landscape .minis { position: absolute; bottom: max(6px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); }
body.touch.landscape .mini { opacity: 0.75; padding: 6px 8px; font-size: 8px; }
body.touch[data-mode="hidden"] #pad .row { visibility: hidden; }
body.touch[data-mode="menu"] .b-atk, body.touch[data-mode="menu"] .b-sp, body.touch[data-mode="menu"] .b-dash { visibility: hidden; }
/* short landscape phones: shrink the cluster a touch so it still fits under the HUD */
@media (orientation: landscape) and (max-height: 380px) {
  body.touch.landscape .btns { transform: scale(0.88); transform-origin: right bottom; }
  body.touch.landscape .stick { width: 128px; height: 128px; }
}
kbd {
  font-family: var(--font-body); font-size: 11px; color: var(--ink);
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px;
  background: var(--panel);
}
</style>

</div>

</div>

const IMG = {}; const FLASH = {};
let toLoad = 0;
for (const k in ASSETS) {
  toLoad++;
  const im = new Image();
  im.onload = () => {
    FLASH[k] = whiteOf(im);
    if (k.startsWith('hero') && !k.includes('_nm')) { const n = k + '_n95'; IMG[n] = recolor(im, N95MAP); FLASH[n] = whiteOf(IMG[n]); }
    toLoad--;
  };
  im.src = ASSETS[k];
  IMG[k] = im;
}
function recolor(im, map) {
  const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
  const x = c.getContext('2d'); x.drawImage(im, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height);
  for (let i = 0; i < d.data.length; i += 4) {
    const k = ((d.data[i] << 16) | (d.data[i + 1] << 8) | d.data[i + 2]).toString(16).padStart(6, '0');
    if (map[k]) { const v = parseInt(map[k], 16); d.data[i] = v >> 16; d.data[i + 1] = (v >> 8) & 255; d.data[i + 2] = v & 255; }
  }
  x.putImageData(d, 0, 0); return c;
}
const N95MAP = { d6e8f3: 'f6f5ef', a7c4d8: 'c9ccd1', '6f8494': '8f949a' };
const TINTS = {};
function tinted(name, col) {
  const key = name + col; if (TINTS[key]) return TINTS[key];
  const src = IMG[name], c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
  const x = c.getContext('2d'); x.drawImage(src, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height);
  return TINTS[key] = c;
}

  const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
  const x = c.getContext('2d'); x.drawImage(im, 0, 0);
  x.globalCompositeOperation = 'source-in'; x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height);
  return c;

function keepInBounds() {
  const M = G.map; if (!M || !M.walk) return;

  for (const e of G.enemies) {
    if (e.state === 'gone') continue;
    if (onFloor(e.x, e.y) && onFloor(e.x, e.y - 2)) { e.sx = e.x; e.sy = e.y; continue; }
    if (e.sx != null) { e.x = e.sx; e.y = e.sy; }
    else {
      let best = null, bd = 1e9;
      for (const r of M.walk) { const x = clamp(e.x, r.x0 + 4, r.x1 - 4), y = clamp(e.y, r.y0 + 4, r.y1 - 2), dd = Math.hypot(x - e.x, y - e.y); if (dd < bd) { bd = dd; best = [x, y]; } }

    if (map.block.some(r => inR(r, px, py))) return false;

/* ---------------- fog (dithered, per PSI level) ---------------- */
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const fogTex = [];
function buildFog(level) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); const d = x.createImageData(W, H);
  let seed = 3 + level; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const blobs = []; for (let i = 0; i < 9; i++) blobs.push([rnd() * W, rnd() * H, 30 + rnd() * 40]);
  const dens = PSI[level].fog;
  for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++) {
    let n = 0; for (const [bx, by, br] of blobs) { const dd = Math.hypot(xx - bx, y - by) / br; if (dd < 1) n += (1 - dd) * 0.35; }
    const v = Math.min(1, dens * (0.55 + n));
    const i = (y * W + xx) * 4;
    if (v * 16 > BAYER[y % 4][xx % 4] + 0.5) { d.data[i] = 201; d.data[i + 1] = 182; d.data[i + 2] = 143; d.data[i + 3] = 200; }
    else { d.data[i] = 201; d.data[i + 1] = 182; d.data[i + 2] = 143; d.data[i + 3] = Math.round(v * 70); }
  }
  x.putImageData(d, 0, 0); return c;
}
const fogLayer = document.createElement('canvas'); fogLayer.width = W; fogLayer.height = H;
const fctx = fogLayer.getContext('2d');
function drawFog(level, px, py) {
  if (!fogTex[level]) fogTex[level] = buildFog(level);
  fctx.globalCompositeOperation = 'source-over'; fctx.clearRect(0, 0, W, H); fctx.drawImage(fogTex[level], 0, 0);
  fctx.globalCompositeOperation = 'destination-out';
  const r = level === 2 ? 46 : 62;
  const g = fctx.createRadialGradient(px, py, r * 0.45, px, py, r);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  fctx.fillStyle = g; fctx.fillRect(0, 0, W, H);
  fctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(fogLayer, 0, 0);
}

function drawEnd(won) {

  ctx.fillStyle = won ? 'rgba(20,40,50,0.55)' : 'rgba(58,15,10,0.6)'; ctx.fillRect(0, 0, W, H);
  const t1 = won ? 'THE RIVER BREATHES' : "YOU CAN'T BREATHE";
  outlined(t1, Math.round(160 - textW(t1, 3) / 2), 26, won ? '#bdefff' : '#d8322a', 3);
  if (G.deadT > 0.8) textC(won ? 'RAFFLES IS DISPERSED. BOAT QUAY CAN BREATHE AGAIN.' : 'PRESS ENTER TO WAKE UP', 160, 52, '#efe6d6');
  if (won && G.deadT > 1.6) {
    textC('BUT THE HAZE IS STILL SPREADING...', 160, 66, '#e8a25c');
    if (save.wins === 1) { panel(86, 80, 234, 104, '#9cc24a'); textC('NEW: PSI KIOSK UNLOCKED', 160, 85, '#9cc24a'); textC('HAZIER RUNS, BIGGER REWARDS', 160, 94, '#bfb4a2'); }
    if (((G.t * 2) | 0) % 2) textC('PRESS ENTER', 160, 112, '#efe6d6');
  }
  panel(92, 132, 228, 172);
  const rows = [['ROOMS CLEARED', G.stats.rooms + ' / 5'], ['HAZED DISPERSED', G.stats.kills], ['COINS', (G.stats.coins || 0) + (won ? '' : ' (LOST)')], ['CLEAN AIR', '+' + G.stats.air]];
  rows.forEach(([k, v], i) => { text(k, 100, 137 + i * 9, '#bfb4a2'); text(v, 220 - textW(String(v)), 137 + i * 9, k === 'CLEAN AIR' ? '#bdefff' : '#efe6d6'); });
}
const pauseOpts = () => G.scene === 'run' ? ['RESUME', 'GIVE UP RUN', 'RETURN TO TITLE'] : ['RESUME', 'RETURN TO TITLE'];
function updatePause() {
  const o = pauseOpts(), n = o.length; G.pauseSel = Math.min(G.pauseSel || 0, n - 1);
  if (hit('pause') || pauseClicked()) { G.paused = false; return; }
  if (hit('up')) { G.pauseSel = (G.pauseSel + n - 1) % n; sfx('menu_move'); }
  if (hit('down')) { G.pauseSel = (G.pauseSel + 1) % n; sfx('menu_move'); }
  if (hit('click')) for (let i = 0; i < n; i++) if (mouse.y >= 72 + i * 14 && mouse.y < 84 + i * 14 && Math.abs(mouse.x - 160) < 60) { G.pauseSel = i; pressed.act = true; }
  if (hit('act')) {
    const c = o[G.pauseSel]; G.paused = false; G.pauseSel = 0; sfx('pick');
    if (c === 'GIVE UP RUN') die();
    if (c === 'RETURN TO TITLE') toTitle();
  }
}
function toTitle() {
  G.scene = 'title'; G.titleSel = 0; G.menu = null; G.dialog = null; G.boon = null; G.shop = null; G.cut = null; G.boss = null;
  G.enemies = []; G.shots = []; G.fx = []; G.pickups = []; G.flags = []; G.waves = []; G.banner = null; G.weapon = null; G.cam = { x: 0, y: 0 };
  P.boons = {}; P.masked = false; persist();
}
function drawLoadout() {
  // left column: every boon (with level), shop buffs and revives this run
  const rows = Object.keys(P.boons).map(k => ({ icon: BOONS[k].icon, name: BOONS[k].name, lv: P.boons[k] }));
  if (P.kopi) rows.push({ icon: 'it_kopi', name: 'KOPI PENG', lv: 0 });
  { const src = G.reviveSrc || [], nm = src.filter(x => x === 'wind').length, no = src.filter(x => x === 'oil').length;
    if (nm) rows.push({ icon: 'mask_gold', name: 'EXTRA MASK X' + nm, lv: 0 });
    if (no) rows.push({ icon: 'it_oil', name: 'MED. OIL X' + no, lv: 0 }); }
  panel(4, 4, 92, H - 4, '#6d6862');
  text('POWER-UPS', 9, 8, '#f2c14e');
  if (!rows.length) { wrap('NONE YET. CLEAR A ROOM TO GET ONE.', 78).forEach((l, i) => text(l, 9, 20 + i * 8, '#6d6862')); return; }
  const per = Math.min(13, Math.floor((H - 26) / rows.length));
  rows.forEach((r, i) => {
    const y = 18 + i * per, sz = Math.min(12, per - 1);
    ctx.drawImage(IMG[r.icon], 8, y, sz, sz);
    const nm = r.name.length > 14 ? r.name.slice(0, 13) + '.' : r.name;
    text(nm, 8 + sz + 3, y + Math.round(sz / 2) - 2, '#efe6d6');
    if (r.lv >= 2) text('II', 84, y + Math.round(sz / 2) - 2, '#9cc24a');
  });
}
function drawPause() {
  ctx.fillStyle = 'rgba(11,10,10,0.7)'; ctx.fillRect(0, 0, W, H);
  if (G.scene === 'run') drawLoadout();
  outlined('PAUSED', Math.round(160 - textW('PAUSED', 3) / 2), 36, '#f2c14e', 3);
  pauseOpts().forEach((o, i) => {
    const sel = i === (G.pauseSel || 0), y = 72 + i * 14;
    if (sel) panel(100, y - 2, 220, y + 9, o === 'GIVE UP RUN' ? '#d8322a' : '#f2c14e');
    textC(o, 160, y + 1, sel ? (o === 'GIVE UP RUN' ? '#ff7b6e' : '#f2c14e') : '#bfb4a2');
  });
  textC('W/S TO CHOOSE, ENTER TO PICK, P TO RESUME', 160, 72 + pauseOpts().length * 14 + 8, '#6d6862');
  if (G.scene === 'run') textC('LEAVING A RUN LOSES IT, BUT YOUR CLEAN AIR IS SAVED.', 160, H - 20, '#6d6862');
}

/* ---------------- main loop ---------------- */
let last = performance.now();
function frame(now) {
  try { frameInner(now); } catch (e) { console.error(e); try { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.lineWidth = 1; } catch (_) {} for (const k in pressed) pressed[k] = false; requestAnimationFrame(frame); }
}
function frameInner(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  G.t += dt;
  if (vacLoop && (G.paused || G.scene !== 'run' || G.weapon !== 'vac' || G.revive || G.cut || !P.sucking)) vacHum(false);
  if (audioReady) { try { const m = musicFor(); if (m && m.blend != null) Music.blend('hospital', 'run', m.blend); else Music.play(m); Music.setDuck(G.paused ? 0.4 : 1); } catch (e) {} }
  if (toLoad > 0) { ctx.fillStyle = '#14100d'; ctx.fillRect(0, 0, W, H); requestAnimationFrame(frame); return; }
  if (hit('mute')) { muted = !muted; if (muted) vacHum(false); Music.setMuted(muted); }
  if (G.banner) { G.banner.t -= dt; if (G.banner.t <= 0) G.banner = null; }
  if (G.coinPop > 0) G.coinPop -= dt;
  updateFx(dt);
  // update
  if (G.dialog) updateDialog();
  else if (G.paused) {
    updatePause();
  }
  else if (G.scene === 'title') updateTitle();
  else if (G.scene === 'intro') updateIntro(dt);
  else if (G.scene === 'hub') updateHub(dt);
  else if (G.scene === 'run') { if (G.hitstop > 0) G.hitstop -= dt; else updateRun(dt); }
  else if (G.scene === 'dead' || G.scene === 'won') {
    G.deadT += dt;
    const go = hit('act') || hit('click');
    if (G.scene === 'dead' && G.deadT > 1.0 && G.deadT < DEATH.stats && go) G.deadT = DEATH.stats;   // skip to the stats
    else if (G.deadT > (G.scene === 'dead' ? DEATH.stats + 0.4 : 0.8) && go) { if (G.scene === 'dead') startIntro('wake'); else toHub(false); }
  }
  // draw
  ctx.save();
  if (G.shake > 0) { G.shake -= dt; ctx.translate(Math.round(rand(-2, 2)), Math.round(rand(-2, 2))); }
  if (G.scene === 'title') drawTitle();
  else if (G.scene === 'intro') drawIntro();
  else if (G.scene === 'hub') { drawHub(); drawMenu(); }
  else if (G.scene === 'run') { drawRun(); drawBoon(); }
  else if (G.scene === 'dead') drawDeath();
  else if (G.scene === 'won') drawEnd(true);
  ctx.restore();
  if (G.banner && !G.dialog && !G.boon && !G.menu) {
    const s = G.banner.s, w = textW(s);
    const by = G.shop && G.scene === 'run' ? 136 : 36;
    ctx.fillStyle = 'rgba(11,10,10,0.7)'; ctx.fillRect(160 - w / 2 - 6, by, w + 12, 11);
    textC(s, 160, by + 3, '#f2c14e');
  }
  drawDialog();
  if (G.paused) drawPause();
  const keepSpecial = touchAim.clearNext && pressed.special && G.scene === 'run' && G.hitstop > 0;
  for (const k in pressed) pressed[k] = false;
  if (keepSpecial) pressed.special = true;
  if (touchAim.clearNext && !pressed.special) { touchAim.on = false; touchAim.clearNext = false; }
  if (document.body.classList.contains('touch')) {
    const mode = G.scene === 'title' ? 'hidden' : (G.scene === 'dead' || G.scene === 'won' || G.boon || G.menu || G.paused) ? 'menu' : 'play';
    if (document.body.dataset.mode !== mode) document.body.dataset.mode = mode;
  }
  requestAnimationFrame(frame);
}

window.__haze = { startIntro, vacOn: () => !!vacLoop, music: () => Music.current,  G, P, save, startRun, nextRoom, toHub, openBoon, damageBoss, damageFlag, disperse, damage, makeRoom };
const boot = () => { try { cv.focus({ preventScroll: true }); } catch (e) {} focusHint.hidden = document.hasFocus(); requestAnimationFrame(frame); };
boot();
})();
</script>
